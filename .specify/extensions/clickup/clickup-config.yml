# Where this repo's feature-cards live, by ID (the clickup plug resolves nothing by name).
#
# Every product folder in this workspace has a list called "Roadmap", which is why names
# were never enough. These are the same IDs the per-feature manifests (.clickup-sync.json)
# already carry.
workspace-id: '90141363864' # Workspace
space-id: '90146746995' # space: 'products'
list-id: '901418532217' # list: 'Roadmap' (products › site › Roadmap)
statuses: # unchanged: mapped by name
  open: 'backlog'
  in-design: 'in design'
  ready: 'ready for development'
  in-development: 'in development'
  in-review: 'in review'
  done: 'shipped'
